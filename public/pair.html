</style></head><body><header class="top"><div class="logo">👑</div><div class="brand">QUEEN RIAM<br>WHATSAPP BOT</div><div class="status">● PAIR SERVER ONLINE</div></header><main class="card"><h1>ULTRA PAIRING<br>SYSTEM</h1><p class="sub">QUEEN RIAM · PUBLIC PAIR</p><p class="hint">Enter your WhatsApp number with country code for instant pairing</p><form id="form"><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="2547XXXXXXXX" maxlength="15" required><button id="submit" type="submit">REQUEST CODE</button></form><section class="result" aria-live="polite"><div id="label">Your code will appear here</div><div id="code" class="code"></div><button id="copy" class="copy" type="button" hidden>COPY CODE</button><div id="message" class="message"></div></section></main><p class="channel">Join our updates: <a href="https://whatsapp.com/channel/0029VbCwmFXDzgT4FzZm6d28" target="_blank" rel="noopener">Queen Riam WhatsApp Channel</a></p><script>
const form=document.getElementById('form'),phone=document.getElementById('phone'),submit=document.getElementById('submit'),label=document.getElementById('label'),codeEl=document.getElementById('code'),msg=document.getElementById('message'),copy=document.getElementById('copy');let current='';
form.addEventListener('submit',async e=>{e.preventDefault();const number=phone.value.replace(/\D/g,'');current='';codeEl.textContent='';copy.hidden=true;msg.textContent='';if(number.length<8||number.length>15){msg.textContent='Enter 8 to 15 digits, including your country code.';return}submit.disabled=true;submit.textContent='GENERATING CODE…';label.textContent='Connecting securely to Queen Riam…';try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not generate pairing code.');if(data.alreadyLinked){label.textContent='This number is already linked';msg.textContent='Your WhatsApp account is already connected to the bot.';return}current=String(data.code||'').replace(/-/g,'').toUpperCase();if(!/^[A-Z0-9]{8}$/.test(current))throw new Error('WhatsApp returned an invalid pairing code. Please try again.');label.textContent='YOUR WHATSAPP PAIRING CODE';codeEl.textContent=current;copy.hidden=false;msg.textContent='On WhatsApp: Linked Devices → Link a Device → Link with phone number instead.'}catch(err){label.textContent='Pairing failed';msg.textContent=err.message}finally{submit.disabled=false;submit.textContent='REQUEST CODE'}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);copy.textContent='COPIED!'}catch(_){msg.textContent='Select and copy the code above.'}});
</script></body></html>
